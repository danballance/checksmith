[project]
name = "checksmith"
description = "Deterministic quality gate that checks a configurable number of tools for coding standard violations."
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "rich>=15",
    "typer>=0.12",
]

[project.scripts]
checksmith = "checksmith.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["checksmith"]
