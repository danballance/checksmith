[project]
name = "checksmith"
description = "Deterministic quality gate that checks a configurable number of tools for coding standard violations."
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "node-semver>=0.9.1",
    "packaging>=25.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15",
    "typer>=0.12",
]

[project.scripts]
checksmith = "checksmith.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "ty>=0.0.1a24",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["checksmith"]
artifacts = ["checksmith/assets/**/*"]

[tool.hatch.build.targets.sdist]
artifacts = ["checksmith/assets/**/*"]
