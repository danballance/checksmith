$schema: https://opencli.org/draft.json
opencli: "0.1"

info:
  title: Checksmith
  summary: Deterministic quality gate that checks a configurable number of tools for coding standard violations.
  description: >-
    Checksmith provides a single interface to a configurable number of code quality tools 
    and provides installation methods to hook those quality gates up to your coding agent(s) of choice.
  version: "0.1.0"

command:
  name: checksmith
  description: Manage coding-agent integrations and enforce project checks.
  examples:
    - checksmith agents install
    - checksmith agents uninstall
    - checksmith init
    - checksmith check --config .checksmith/checksmith.yaml

  options:
    - name: --help
      aliases:
        - -h
      description: Show help for Checksmith or the selected command.

    - name: --version
      description: Show the installed Checksmith version.

    - name: --debug
      aliases:
        - -d
      description: >-
        Write debug logging to stderr. May be given anywhere on the command
        line, before or after the subcommand. Results stay on stdout, so
        `--debug --format json` is still parseable.

  exitCodes:
    - code: 0
      description: The operation completed successfully.
    - code: 1
      description: The operation completed but found a failing or unhealthy state.
    - code: 2
      description: Checksmith could not complete the operation.

  commands:
    - name: agents
      description: Manage integrations with supported coding agents.
      commands:
        - name: install
          description: Register integrations with selected coding agents.
          interactive: false
          metadata:
            - name: checksmith.operation
              value:
                operationId: agents.install
            - name: checksmith.output
              value:
                kind: AgentsInstall
          examples:
            - checksmith agents install

        - name: uninstall
          description: Remove integrations from selected coding agents.
          interactive: false
          metadata:
            - name: checksmith.operation
              value:
                operationId: agents.uninstall
            - name: checksmith.output
              value:
                kind: AgentsUninstall
          examples:
            - checksmith agents uninstall

    - name: init
      description: Create the project's Checksmith YAML configuration.
      interactive: false
      metadata:
        - name: checksmith.operation
          value:
            operationId: init
        - name: checksmith.output
          value:
            kind: Init
      examples:
        - checksmith init

    - name: check
      description: Execute the project's configured checks and report their results.
      interactive: false
      options:
        - name: --format
          description: Select the output format for this command.
          arguments:
            - name: format
              required: true
              acceptedValues:
                - text
                - json
              description: >-
                Output format. Use `text` for human-readable console output
                and `json` for machine-readable output. Defaults to `text`.

        - name: --config
          required: true
          description: Select the config file describing the checks to run.
          arguments:
            - name: config
              required: true
              description: >-
                Path to a config file. A relative path resolves from the
                caller's current directory. Checksmith never searches for a
                config file and never falls back to another file: if the named
                path cannot be read, that is an error.

        - name: --check
          required: false
          description: Select one configured check by its exact ID; omit to select all.
          arguments:
            - name: id
              required: true
      metadata:
        - name: checksmith.operation
          value:
            operationId: check
        - name: checksmith.output
          value:
            kind: Check
      examples:
        - checksmith check --config .checksmith/checksmith.yaml
        - checksmith check --config checksmith.yaml --format json
