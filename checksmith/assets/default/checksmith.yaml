schema_version: 1

# Relative to the directory containing this config file.
project_root: ../../..

checks:
  - id: ruff
    package_type: uvx
    package: "ruff==0.16.7"
    command: ruff

    args:
      - check
      - --config
      - ./checksmith/assets/default/ruff.toml
      - --output-format
      - json
      - .

  - id: semgrep
    package_type: uvx
    package: "semgrep==1.176.1"
    command: semgrep

    args:
      - scan
      - --config
      - ./checksmith/assets/default/semgrep.yaml
      - --json
      - --error
      - --strict
      - .
