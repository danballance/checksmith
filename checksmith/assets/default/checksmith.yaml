schema_version: 1

project_root: ../../..

# An argument written as `config_path:` names a file relative to this config filed.
# Every path written as a plain text string resolves relative to project_root.
checks:
  - id: ruff
    package_type: uvx
    package: "ruff==0.16.7"
    command: ruff

    args:
      - check
      - --config
      - config_path: ruff.toml
      - --output-format
      - json
      - .

  - id: semgrep
    package_type: uvx
    package: "semgrep==1.176.1"
    command: semgrep

    args:
      - scan
      - --config
      - config_path: semgrep.yaml
      - --json
      - --error
      - --strict
      - .

  - id: ty
    package_type: uvx
    package: "ty==0.0.80"
    command: ty

    args:
      - check
      - --output-format
      - gitlab
      - --error-on-warning
      - .

  - id: pytest
    package_type: uv
    package: null
    command: pytest

    args:
      - tests
      - --cov=.
      - --cov-config
      - config_path: coverage.toml
      - --cov-report=term-missing
      - --cov-fail-under=90

  - id: pyarchgraph
    package_type: uvx
    package: "pyarchgraph @ git+https://github.com/danballance/pyarchgraph@9d48623d405034f6f32b6eb87f059a2713f1e900"
    command: pyarchgraph

    args:
      - .
      - --project-root
      - .
      - --output
      - json
      - --output-dir
      - build/pyarchgraph
