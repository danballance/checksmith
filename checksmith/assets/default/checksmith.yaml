schema_version: 1

project_root: ../../..

# An argument written as `config_path:` names a file relative to this config filed.
# Every path written as a plain text string resolves relative to project_root.
checks:
  - id: astcheck
    package_type: uvx
    package: "checksmith @ git+https://github.com/danballance/checksmith@main"
    command: astcheck

    args:
      - check
      - --config
      - config_path: astcheck.yaml
      - --format
      - json

  - id: ruff
    package_type: uvx
    package: "ruff==0.16.7"
    command: ruff

    args:
      - check
      - --config
      - config_path: ruff.toml
      - --output-format
      - json
      - .

  - id: semgrep
    package_type: uvx
    package: "semgrep==1.176.1"
    command: semgrep

    args:
      - scan
      - --config
      - config_path: semgrep.yaml
      - --json
      - --error
      - --strict
      - .

  - id: complexipy
    package_type: uvx
    package: "complexipy==8.0.1"
    command: complexipy

    args:
      - --plain
      - --failed
      - --max-complexity-allowed
      - "10"
      - --exclude
      - "tests/**"
      - --color
      - "no"
      - --snapshot-ignore
      - --snapshot-create=false
      - --ignore-complexity=false
      - --report-ignored=false
      - .

  - id: ty
    package_type: uvx
    package: "ty==0.0.80"
    command: ty

    args:
      - check
      - --output-format
      - gitlab
      - --error-on-warning
      - .

  - id: pytest
    package_type: uv
    package: null
    command: pytest

    args:
      - tests
      - --cov=.
      - --cov-config
      - config_path: coverage.toml
      - --cov-report=term-missing
      - --cov-fail-under=90

  - id: pyarchgraph-modules
    package_type: uvx
    package: "pyarchgraph @ git+https://github.com/danballance/pyarchgraph@main"
    command: pyarchgraph

    args:
      - .
      - --gate
      - structural

  - id: pyarchgraph-packages
    package_type: uvx
    package: "pyarchgraph @ git+https://github.com/danballance/pyarchgraph@main"
    command: pyarchgraph

    args:
      - .
      - --gate
      - package-structural
