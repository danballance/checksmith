schema_version: 1

# Relative to the directory containing this config file.
project_root: ../../..

checks:
  - id: ruff
    package_type: uvx
    package: "ruff==0.16.7"
    command: ruff

    args:
      - check
      - --config
      - ./checksmith/assets/default/ruff.toml
      - --output-format
      - json
      - .
